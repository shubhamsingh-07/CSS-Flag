<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    .flag{
      background-color:#CE1126;
      width:900px;
      height:600px;
      position:relative;
      top:0px;
      left:0px;
    }
    .flag > div{
      background-color:#002868;
      width:100%;
      height:300px;
      position:absolute;
      left:0px;
      top:150px
    }

    .flag > div > div{
      background-color:white;
      width:200px;
      height:200px;
      position: absolute;
      top:50px;
      left: 350px;
      border-radius:50%;
    }
    p{
      text-align: center;
      font-size:5rem;
      color: white;
      margin:0px;
    }

    .flag  div  div p{
      color: black;
    }


    
  </style>
</head>


<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
